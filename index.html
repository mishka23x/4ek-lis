<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>FAQ</title>
	<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root{
    --text-scale:1.40;
    --paper:#F7F1E4; --paper-2:#EFE7D2; --ink:#2B2A24; --ink-soft:#5B5649;
    --forest:#2F4A3D; --forest-2:#456654; --amber:#B8752E; --amber-soft:#EADFC4;
    --amber-text:#86501E; --coral:#9A392F; --line:#DCD0AE; --focus:#7A3E00; --radius:10px;
    --font-display: Segoe UI Variable, Roboto, Arial, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    --font-mono: 'Courier New', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body); line-height:1.5; overflow-wrap:break-word; }
  h1,h2{font-family:var(--font-display); margin:0; color:var(--forest);}
  .skip-link{position:fixed; z-index:10000; top:8px; left:8px; transform:translateY(-160%); background:#fffdf8; color:var(--forest); border:2px solid var(--focus); border-radius:7px; padding:9px 12px; font-weight:700;}
  .skip-link:focus{transform:none;}
  header.top{ padding:22px 24px 16px; border-bottom:1px solid var(--line); }
  header.top h1{font-size:calc(26px * var(--text-scale)); font-weight:700; overflow-wrap:anywhere;}
  header.top .sub{color:var(--ink-soft); font-size:calc(13px * var(--text-scale)); margin-top:2px; overflow-wrap:anywhere;}
  main{width:100%; max-width:900px; min-width:0; margin:0 auto; padding:20px 24px 60px;}

  main a{ color:var(--forest); text-decoration:none; border-bottom:1px solid var(--amber); padding-bottom:1px; }
  a.tag-link{display:inline; max-inline-size:100%; color:var(--forest); font-weight:600; border:1px solid var(--amber); border-radius:999px; padding:1px 10px 2px; font-size:1.1em; border-bottom:none; text-decoration:none; overflow-wrap:anywhere; box-decoration-break:clone; -webkit-box-decoration-break:clone;}

  .faq-item{ background:#fffdf8; border:1px solid var(--line); border-radius:var(--radius); margin-bottom:12px; overflow:hidden; }
  .faq-item summary{
    list-style:none; cursor:pointer; min-height:44px; padding:14px 46px 14px 18px; position:relative;
    font-weight:600; color:var(--forest); font-size:calc(16px * var(--text-scale));
  }
  .faq-item summary::-webkit-details-marker{ display:none; }
  .faq-item summary::after{
    content:'+'; position:absolute; right:16px; top:50%; transform:translateY(-50%);
    color:var(--amber); font-size:calc(20px * var(--text-scale)); line-height:1; font-weight:400;
  }
  .faq-item[open] summary::after{ content:'–'; }
  .faq-item[open] summary{ border-bottom:1px solid var(--line); }
  .faq-answer{padding:14px 18px 16px; color:var(--ink); font-size:calc(14px * var(--text-scale)); white-space:pre-line; overflow-wrap:anywhere;}
  .empty{color:var(--ink-soft); font-style:italic; font-size:calc(14px * var(--text-scale));}

  .checklist-link{
    display:inline-block; max-width:100%; margin-top:12px; color:var(--forest); font-family:var(--font-display);
    font-weight:700; font-size:calc(36px * var(--text-scale)); text-decoration:none;
    padding-bottom:2px; overflow-wrap:anywhere;
  }
.header-line {
    display: flex;
    align-items: baseline;
    min-width:0;
}

.header-line h1 {
    margin: 0;
}

.header-text {
    flex: 1;
    min-width:0;
    text-align: center;
    white-space: nowrap;
}

@media (max-width: 600px) {
    .header-line {
        flex-direction: column;
        align-items: flex-start;
    }

    .header-text {
        width: 100%;
        text-align: left;
        white-space: normal;
    }
}

  .card{ background:#fffdf8; border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-top:22px; }
  .card h2{font-family:var(--font-display); color:var(--forest); margin:0 0 6px; font-size:calc(17px * var(--text-scale));}
  .card .hint{ color:var(--ink-soft); font-size:calc(13px * var(--text-scale)); margin:0; }
  :where(a,summary):focus-visible{outline:3px solid var(--focus); outline-offset:3px;}
  @media (hover:hover){
    main a:hover,.checklist-link:hover{color:var(--amber-text); border-bottom-color:var(--forest);}
    a.tag-link:hover{background:var(--forest); color:var(--paper); border-color:var(--forest);}
  }
  @media (max-width:600px){
    header.top,main{padding-left:16px; padding-right:16px;}
    .checklist-link{font-size:clamp(2rem,12vw,calc(36px * var(--text-scale))); min-height:44px;}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important;}
  }
  @media (forced-colors:active){:where(a,summary):focus-visible{outline-color:Highlight;}}
</style>
</head>
<body>

<a class="skip-link" href="#mainContent">Перейти к содержанию</a>
<header class="top">
  <div class="header-line">
    <div>
      <h1 id="faqTitle">🦊 ЧАВО </h1>
      <div class="sub" id="faqSub">частые вопросы</div>
    </div>
    <div class="header-text"><a href="checklist.html" class="checklist-link">📋 Перейти к 4ек-Лису</a></div>
  </div>
</header>

<main id="mainContent" tabindex="-1">
  <div id="faqList"></div>

  <div class="card">
    <h2>Остались вопросы?</h2>
    <p class="hint">Напишите нам: <a href="https://4ek-lis.livejournal.com/" target="_blank" rel="noopener noreferrer">4ek-lis на связи</a></p>
  </div>
</main>
