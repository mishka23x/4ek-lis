<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://ic.pics.livejournal.com data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'">

<style>
  :root{
    --text-scale:1.40;
    --paper:#F7F1E4; --paper-2:#EFE7D2; --ink:#2B2A24; --ink-soft:#5B5649;
    --forest:#2F4A3D; --forest-2:#456654; --amber:#B8752E; --amber-soft:#EADFC4;
    --amber-text:#86501E; --coral:#9A392F; --line:#DCD0AE; --control-line:#877C61;
    --focus:#7A3E00; --radius:10px; --progress-footer-height:90px;
    --font-display: Segoe UI Variable, Roboto, Arial, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    --font-mono: 'Courier New', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:12px; scroll-padding-bottom:calc(var(--progress-footer-height) + 20px + env(safe-area-inset-bottom));}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body); line-height:1.5; padding-bottom:calc(var(--progress-footer-height) + 24px + env(safe-area-inset-bottom)); overflow-wrap:break-word; }
  h1,h2,h3{font-family:var(--font-display); margin:0; color:var(--forest);}
  .mono{font-family:var(--font-mono);}
  .visually-hidden{position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important;}
  .skip-link{position:fixed; z-index:10000; top:8px; left:8px; transform:translateY(-160%); background:#fffdf8; color:var(--forest); border:2px solid var(--focus); border-radius:7px; padding:9px 12px; font-weight:700;}
  .skip-link:focus{transform:none;}
  header.top{ padding:22px 24px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  header.top>div:first-child{min-width:0; max-width:100%;}
  header.top h1{font-size:calc(26px * var(--text-scale)); font-weight:700; overflow-wrap:anywhere;}
  header.top .sub{color:var(--ink-soft); font-size:calc(13px * var(--text-scale)); margin-top:2px; overflow-wrap:anywhere;}
  .iobar{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  button,.faq-link,a.ghost{touch-action:manipulation;}
  button.ghost{ border:1px solid var(--control-line); background:transparent; color:var(--ink-soft); min-height:40px; padding:7px 12px; border-radius:8px; font-size:calc(12px * var(--text-scale)); cursor:pointer; font-family:var(--font-body); }
  button.ghost:disabled{opacity:.5; cursor:default;}
  main{width:100%; max-width:1300px; min-width:0; margin:0 auto; padding:20px 24px;}
  .card{ background:#fffdf8; border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:18px; }
  .row{display:flex; min-width:0; gap:10px; align-items:center; flex-wrap:wrap;}
  input[type=text], input[type=url], input[type=number]{ max-width:100%; font-family:var(--font-body); font-size:calc(14px * var(--text-scale)); padding:8px 10px; border:1px solid var(--control-line); border-radius:7px; background:#fff; color:var(--ink); }
  .cat-header{display:flex; min-width:0; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px;}
  .cat-title-row{flex:1; flex-wrap:nowrap; gap:6px;}
  .cat-header h2{min-width:0; font-size:calc(18px * var(--text-scale)); overflow-wrap:anywhere;}
  .category-count{flex:none; margin-top:0;}
  .task-grid{display:grid; min-width:0; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px 16px;}
  @media (max-width:640px){.task-grid{grid-template-columns:1fr;}}
  .task-card{min-width:0; border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:#fffefb;}
  .task-card.done{background:var(--amber-soft); border-color:var(--amber);}
  .task-card-inner{display:grid; min-width:0; grid-template-columns:minmax(0,1fr) auto; column-gap:10px; align-items:start;}
  .task-choice{display:grid; min-width:0; grid-template-columns:24px minmax(0,1fr); gap:8px; align-items:start; font-size:calc(14px * var(--text-scale));}
  .task-text{min-width:0; white-space:pre-line; overflow-wrap:anywhere; cursor:pointer;}
  .task-text a{cursor:pointer;}
  .task-card input[type=checkbox]{margin:4px 0 0; width:22px; height:22px; accent-color:var(--forest); flex:none;}
  .task-card .task-marks{grid-column:2; grid-row:1; display:flex; flex-direction:column; gap:5px; margin:0;}
  .task-card .links{grid-column:1 / -1; min-width:0; margin:8px 0 0 32px; display:flex; flex-direction:column; gap:6px;}
  .link-field{display:flex; flex-direction:column; gap:2px;}
  .link-row{display:flex; min-width:0; align-items:center; gap:6px;}
  .link-num{color:var(--ink-soft); font-weight:700; font-size:calc(12px * var(--text-scale)); flex:none; min-width:1.6em; text-align:right;}
  .link-row input{width:100%; flex:1; min-width:0;}
  .links input{font-size:calc(12px * var(--text-scale)); padding:6px 8px;}
  .links input.link-bad{border-color:var(--coral); background:#FBEAE6;}
  .link-warn{font-size:calc(11px * var(--text-scale)); color:var(--coral);}
  .quotas{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr)); gap:12px; margin-bottom:6px;}
  .quota{border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:#fffefb;}
  .quota .label{display:block; font-size:calc(13px * var(--text-scale)); color:var(--ink-soft); margin-bottom:6px;}
  .quota .set{display:flex; align-items:center; gap:8px;}
  .quota input[type=number]{width:70px;}
  footer.progress{position:fixed; z-index:1000; bottom:0; left:0; right:0; background:#fffdf8; border-top:1px solid var(--control-line); padding:10px 24px calc(10px + env(safe-area-inset-bottom)); display:flex; align-items:center; gap:16px; flex-wrap:nowrap;}
  progress.bar-wrap{flex:1; min-width:0; height:10px; appearance:none; border:0; background:var(--paper-2); border-radius:999px; overflow:hidden;}
  progress.bar-wrap::-webkit-progress-bar{background:var(--paper-2); border-radius:999px;}
  progress.bar-wrap::-webkit-progress-value{background:var(--amber); border-radius:999px;}
  progress.bar-wrap::-moz-progress-bar{background:var(--amber); border-radius:999px;}
  .progress-num{font-family:var(--font-mono); font-weight:700; color:var(--forest); white-space:nowrap;}
  footer.progress .hint{margin-top:0; white-space:nowrap;}
  .hint{color:var(--ink-soft); font-size:calc(12px * var(--text-scale)); margin-top:6px;}
  .empty{color:var(--ink-soft); font-style:italic; font-size:calc(14px * var(--text-scale));}
  #fileInputFull{display:none;}
  #announceBlock{width:100%;}
  .reset-button{border-color:var(--coral)!important; color:var(--coral)!important;}
  .field-label{display:block;}
  .nick-input{width:220px;}
  .sync-hint,.final-status{margin-top:6px;}
  .section-heading{margin-bottom:10px; font-size:calc(18px * var(--text-scale));}
  .final-send-wrap{margin-top:14px; padding-top:14px; border-top:1px solid var(--line);}

  main a, .cat-desc a{ color:var(--forest); text-decoration:none; border-bottom:1px solid var(--amber); padding-bottom:1px; }
  a.tag-link{display:inline; max-inline-size:100%; color:var(--forest); font-weight:600; border:1px solid var(--amber); border-radius:999px; padding:1px 10px 2px; font-size:1.2em; border-bottom:none; text-decoration:none; overflow-wrap:anywhere; box-decoration-break:clone; -webkit-box-decoration-break:clone;}

  #coverImageWrap{width:100%; max-width:1300px; aspect-ratio:2459 / 432; margin:0 auto 18px; padding:0 24px;}
  #coverImageWrap img{width:100%; height:100%; object-fit:contain; display:block; border-radius:var(--radius); border:1px solid var(--line);}
  #coverImageWrap.cover-error img{visibility:hidden;}

  .cat-desc{min-width:0; font-size:calc(18px * var(--text-scale)); font-weight:700; color:var(--ink-soft); border-radius:8px; padding:6px 10px; margin-bottom:8px; white-space:pre-line; overflow-wrap:anywhere;}

  .cat-toggle{background:transparent; border:1px solid var(--control-line); color:var(--ink-soft); width:32px; height:32px; border-radius:6px; cursor:pointer; font-size:12px; flex:none;}
  .card.collapsed .cat-body{ display:none; }
  .collapse-toolbar{display:flex; justify-content:flex-end; gap:8px; margin:2px 0 10px; flex-wrap:wrap;}

  .mark-btn{border:1px solid var(--control-line); background:#fff; color:var(--ink-soft); width:34px; height:34px; border-radius:6px; cursor:pointer; font-size:calc(13px * var(--text-scale)); line-height:1; display:flex; align-items:center; justify-content:center; padding:0;}
  .mark-btn.on{ background:var(--amber-soft); border-color:var(--amber); color:var(--amber); }
  .mark-btn.on[data-mark*="|liked"]{ background:#F6D9D2; border-color:var(--coral); color:var(--coral); }

  .typo-strip{ max-width:1300px; margin:0 auto 24px; padding:0 24px; }
  .typo-row{display:flex; align-items:center; gap:10px; background:var(--paper-2); border:1px solid var(--line); border-radius:999px; padding:10px 16px; flex-wrap:wrap;}
  .typo-row .typo-label{color:var(--ink-soft); font-size:calc(12px * var(--text-scale));}
  .typo-row a.ghost{ text-decoration:none; }
  .task-num{ color:var(--ink-soft); font-weight:700; }
  .stats-values{display:flex; flex-direction:column; gap:8px;}
  #celebrateLayer{position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden;}
  .celebrate-msg{
    position:fixed; top:16%; left:50%; transform:translate(-50%,-40px) scale(.8);
    background:var(--forest); color:var(--paper); font-family:var(--font-display);
    font-weight:700; font-size:calc(18px * var(--text-scale)); padding:14px 26px;
    border-radius:999px; box-shadow:0 8px 24px rgba(0,0,0,.25); text-align:center;
    opacity:0; animation:celebrateMsg 2.6s ease forwards; max-width:80vw;
  }
  @keyframes celebrateMsg{
    0%{opacity:0; transform:translate(-50%,-40px) scale(.8);}
    12%{opacity:1; transform:translate(-50%,0) scale(1);}
    80%{opacity:1;}
    100%{opacity:0; transform:translate(-50%,-10px) scale(.95);}
  }
  .celebrate-particle{
    position:fixed; top:-40px; font-size:calc(22px * var(--text-scale));
    animation-name:celebrateFall; animation-timing-function:ease-in; animation-fill-mode:forwards;
  }
  @keyframes celebrateFall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(100vh) rotate(360deg); opacity:0; }
  }
  .celebrate-msg-reduced{opacity:1; transform:translate(-50%,0); animation:none;}
  .faq-link{
    color:var(--forest); font-family:var(--font-display); font-weight:700;
    min-height:40px; display:inline-flex; align-items:center; font-size:calc(15px * var(--text-scale)); text-decoration:none;
    border-bottom:2px solid var(--amber); padding-bottom:1px; margin-right:6px;
  }
  :where(button,a,input,summary):focus-visible{outline:3px solid var(--focus); outline-offset:3px;}
  :where(input,button,a){scroll-margin-block:12px calc(var(--progress-footer-height) + 20px);}
  @media (hover:hover){
    button.ghost:hover,.cat-toggle:hover,.mark-btn:hover{border-color:var(--forest); color:var(--forest);}
    main a:hover,.cat-desc a:hover,.faq-link:hover{color:var(--amber-text); border-bottom-color:var(--forest);}
    a.tag-link:hover{background:var(--forest); color:var(--paper); border-color:var(--forest);}
  }
  @media (max-width:640px){
    header.top,main{padding-left:16px; padding-right:16px;}
    .iobar{width:100%;}
    input[type=text],input[type=url],input[type=number]{font-size:max(16px,calc(14px * var(--text-scale)));}
    .links input{font-size:max(16px,calc(12px * var(--text-scale)));}
    button.ghost,.faq-link,.cat-toggle,.mark-btn{min-height:44px;}
    .cat-toggle,.mark-btn{width:44px; height:44px;}
    footer.progress{padding-left:12px; padding-right:12px; gap:8px;}
    .card{padding:14px 12px;}
    .task-card .links{margin-left:0;}
    #coverImageWrap,.typo-strip{padding-left:16px; padding-right:16px;}
  }
  @media (prefers-reduced-motion:reduce){
    html:focus-within{scroll-behavior:auto;}
    *,*::before,*::after{animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important;}
    .celebrate-particle{display:none;}
  }
  @media (forced-colors:active){
    .task-card.done,.mark-btn.on{forced-color-adjust:auto;}
    :where(button,a,input):focus-visible{outline-color:Highlight;}
  }
</style>
</head>

<main id="mainContent" tabindex="-1">

  </div>
  <div id="categoriesView"></div>
</main>

<footer class="progress" aria-label="Прогресс чек-листа">

</footer>

        {
          "id": "tnp5kuwp",
          "text": "Напишите пост с примером полезного кода (и пояснением для чайников, что это)"
        },
        {
          "id": "twxvi57q",
          "text": "Сделайте слайд-шоу (из иллюстраций с подписями) в альбоме ЖЖ и поделитесь этим альбомом в посте."
        },
        {
          "id": "t6i85mvx",
          "text": "Опубликуйте «пост из комментария»."
        },
        {
          "id": "tq60ksij",
          "text": "Опубликуйте статистику, используя любые доступные источники ЖЖ: поисковую страницу, страницы рейтингов, статистику блога и т. д."
        },
        {
          "id": "tvgpe3pe",
          "text": "Отправьте новый пост в свой блог по почте."
        },
        {
          "id": "taoldmua",
          "text": "Запостите короткую запись с картинкой через мобильное  приложение."
        },
        {
          "id": "teyi09vw",
          "text": "Напишите длинный обстоятельный пост-лонгрид."
        },
        {
          "id": "txkgdr06",
          "text": "#раскопайсвоихнетленок, ретропостинг, вторая жизнь старых записей - как бы вы сейчас об этом написали, что добавили, что изменили?"
        },
        {
          "id": "tmox0nek",
          "text": "Запостите фоторассказ, составленный по всем правилам драматургии: зачин, кульминация, развязка."
        },
        {
          "id": "td0j3q61",
          "text": "Посоветуйтесь о чём-нибудь с читателями своего блога."
        },
        {
          "id": "t2f9wj7e",
          "text": "Поблагодарите в своей записи того (или тех), чей пост в ЖЖ оказался для вас полезным."
        },
        {
          "id": "t9mbflqd",
          "text": "Сделайте интервью с кем-либо (или даже — с чем-либо)."
        },
        {
          "id": "tvnk61t2",
          "text": "Напишите пост на тему «Один мой день»."
        },
        {
          "id": "tpfjyhqo",
          "text": "«Мой первый раз с... или в...» или «Первый раз, когда я...»."
        },
        {
          "id": "tfkrt5s7",
          "text": "Напишите «Открытое письмо» — кому-то известному либо личному знакомому; герою книги или фильма; себе в прошлом; общественной организации или даже природному явлению."
        },
        {
          "id": "tq19fqqw",
          "text": "Напишите пост-сравнение: плюсы и минусы того и другого — товара, сервиса, маршрута — чего угодно. Юмористическое сравнение «бегемота с кашалотом» приветствуется."
        },
        {
          "id": "thecodme",
          "text": "Предложите френдам игру, эстафету или блиц-хешмоб."
        },
        {
          "id": "t5p9wzjh",
          "text": "Составьте список-угадайку: «10 фактов о себе» (один — неверный)."
        },
        {
          "id": "tr5k0xcs",
          "text": "Напишите пост в жанре или формате, который никогда ещё не пробовали. Вплоть до 18+ (без фанатизма)."
        },
        {
          "id": "tyac9nba",
          "text": "Объясните что-то, в чём вы хорошо разбираетесь."
        },
        {
          "id": "t5s0zx9g",
          "text": "Опубликуйте пошаговую инструкцию на любую тему (шуточное литературное произведение в форме мануала — годится)."
        },
        {
          "id": "tbyxcj7l",
          "text": "Сгенерируйте видео на основе своего юзерпика."
        },

          "id": "teb8rnn7",

          "text": "**#веловоскресенье:** - Умеете держаться на велосипеде? Помните, как учились? \nЕсть велик? Где вы его храните? Сити-байк или спортивный? \nКогда последний раз катались? Какой самый дальний маршрут случалось проехать? Удобная ли вокруг местность для поездок? \nРазбортовать и заклеить камеру сумеете? Слетевшую цепь поправить? \nКак вам электровеники? Пробовали? Надолго хватает заряда? Велотренажёр vs. реальные покатушки?"
        },
        {
          "id": "tc27jpkt",
          "text": "**#цветыпопонедельникам** - Любимый цветок? Сами разводите? У вас лёгкая рука — всё растёт и цветёт, что ни посади?\nМного цветов вокруг? Газоны ухоженные? Есть интересные цветочные инсталляции? \nВы за кого, если выбирать между: «Цветы для того и выращивают, чтобы делать букеты; продукты мы едим, цветами любуемся, их срок недолог — и это в порядке вещей» и «Цветам место исключительно на клумбе, а не в вазе!»? \nЕсли нужно на скорую руку изобразить цветочек, что это будет — ромашка, тюльпанчик, розочка? Нарисуйте и раскрасьте )"
        },
        {
          "id": "tzb5obb7",
          "text": "**#архитектураповторникам** - Что вам больше по душе — старинные особнячки или современный стиль из стекла и стали? Знаете названия архитектурных стилей? Отличите на местности рококо от сталинского ампира?\nПокажите самое необычное здание в округе. Самое ветхое. Самое симпатичное. Самое высокое. Дом с историей. Есть такое, куда хотелось бы заглянуть: а как там внутри?\nПомните свою школу, вуз, садик — как выглядело здание? Типовой проект или что-то особенное?\nПокажите интересную «малую архитектурную форму», мимо которой часто ходите."
        },
        {
          "id": "tpjioiap",
          "text": "**#природнаясреда** - Далеко или в пешей доступности? Ухоженная, с размеченными дорожками, или первозданный бурелом? Есть у вас любимые местечки на природе, у водоёма? Часто удаётся выбраться?\nНа пляже были этим летом или не очень-то и хотелось?\nЕсть ли любимые природные уголки, о которых вы вспоминаете с грустью — теперь асфальт и бетон на месте полян и родников?\nСамая первая из запомнившихся прогулок на природе? \nЕсли сейчас станете выбирать отдых под открытым небом, где предпочтёте его провести — в лесу, на море, у реки, в горах...?"
        },
        {
          "id": "tv2uo34d",
          "text": "**#жизненнаясреда** - Антропогенное окружение \nКуда бы вы повели подругу показать  любимые места? А сами там часто гуляете?\nОткуда на ваш город или округу можно посмотреть с высоты?\nСамое выигрышное время или сезон для фото вашего города/местности — в ночной подсветке, в утренней дымке, в снегу, на пике цветения?"
        },
        {
          "id": "tvsbpyjb",
          "text": "#**танцыпосредам** - Умеете танцевать? Занимаетесь профессионально?\nЗастали парковые танцплощадки с живой музыкой? Или дискотеки с диджеями?\nДавно ли танцевали на вечеринке или корпоративе?\nТанцы на площади (под старинный патефон) — бывает у вас такое?"
        },
        {
          "id": "tmgue13h",
          "text": "#**птицыпочетвергам** - Сколько птичьих голосов могли бы различить? (Кукушка, воробей, ворона... считаются.)\nСлучалось видеть птичье гнездо живьем, не на фото? Чьё?\nКормите пернатых регулярно, принципиально не кормите или смотря кого и где? С голубями уживаетесь?\nВ опросе «какую птицу выбрать символом города, области, страны» кого бы вы выбрали?\nСамая редкая из птиц, которых вам случалось увидеть или заснять? (В зоопарке тоже годится, если чем-то запомнилась.)"
        },
        {
          "id": "tws8ryyz",
          "text": "#**рыбныйчетверг** - Рыбу ловите? Хоть разок пробовали удить? Что сложнее — поймать или потом возиться с разделкой? А коптить умеете? Есть свой фирменный подход к засолке?\nЛюбите смотреть на аквариум? Есть свой? Пробовали когда-нибудь завести? Долго продержался?\nАкулу живьём видели? А дельфина гладили?\nЗолотая рыбка права или вы бы на её месте отблагодарили старика более действенно? Или не за что его благодарить-то?"
        },
        {
          "id": "tvxjr322",
          "text": "#**четвероногийчетверг** - На ком из четвероногих вы катались верхом? (В два года на домашнем пёсике — тоже считаем.)\nГужевой транспорт случалось видеть не на аттракционе? А кого видели в естественной среде? (Не в вольере.) Кто-то, кроме собак, за вами гнался?\nЗа кем приходилось ухаживать?  Терпеть не могу... - есть такие?\n«Если бы не фермы, ... вообще бы уже не осталось, а посевы ради растительного рациона полностью вытеснили бы остатки дикой природы»: — «да» / «нет» / «не знаю»?"

        {
