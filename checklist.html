  .mono{font-family:var(--font-mono);}
  header.top{ padding:22px 24px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  header.top h1{font-size:calc(26px * var(--text-scale)); font-weight:700;}
  header.top .sub{color:var(--ink-soft); font-size:calc(13px * var(--text-scale)); margin-top:2px;}
  .iobar{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  button.ghost{ border:1px solid var(--line); background:transparent; color:var(--ink-soft); padding:7px 12px; border-radius:8px; font-size:calc(12px * var(--text-scale)); cursor:pointer; font-family:var(--font-body); }
  button.ghost:hover{border-color:var(--forest); color:var(--forest);}
  button.ghost:disabled{opacity:.5; cursor:default;}
  main{max-width:1300px; margin:0 auto; padding:20px 24px;}
  .card{ background:#fffdf8; border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:18px; }
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  input[type=text], input[type=number]{ font-family:var(--font-body); font-size:calc(14px * var(--text-scale)); padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink); }

  .cat-header h3{font-size:calc(18px * var(--text-scale));}

   .task-card.done{background:var(--amber-soft); border-color:var(--amber);}
   .task-card-inner{display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:10px; align-items:start;}
   .task-card label{display:flex; gap:8px; align-items:flex-start; cursor:pointer; font-size:calc(14px * var(--text-scale)); min-width:0;}
   .task-card label span{white-space:pre-line;}
   .task-card input[type=checkbox]{margin-top:4px; width:18px; height:18px; accent-color:var(--forest); flex:none;}
   .task-card .task-marks{grid-column:2; grid-row:1; display:flex; flex-direction:column; gap:5px; margin:0;}
   .task-card .links{grid-column:1 / -1; margin:8px 0 0 26px; display:flex; flex-direction:column; gap:6px;}
  .link-field{display:flex; flex-direction:column; gap:2px;}
  .link-row{display:flex; align-items:center; gap:6px;}
  .link-num{color:var(--ink-soft); font-weight:700; font-size:calc(12px * var(--text-scale)); flex:none; min-width:1.6em; text-align:right;}
  .link-row input{flex:1; min-width:0;}
  .links input{font-size:calc(12px * var(--text-scale)); padding:6px 8px;}
  .links input.link-bad{border-color:var(--coral); background:#FBEAE6;}
  .link-warn{font-size:calc(11px * var(--text-scale)); color:var(--coral);}
  .quotas{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; margin-bottom:6px;}
  .quota{border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:#fffefb;}
  .quota .label{font-size:calc(13px * var(--text-scale)); color:var(--ink-soft); margin-bottom:6px;}
  .quota .set{display:flex; align-items:center; gap:8px;}
  .quota input[type=number]{width:70px;}
  footer.progress{ position:fixed; bottom:0; left:0; right:0; background:#fffdf8; border-top:1px solid var(--line); padding:10px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .bar-wrap{flex:1; min-width:200px; height:10px; background:var(--paper-2); border-radius:999px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--amber); transition:width .3s;}
  .progress-num{font-family:var(--font-mono); font-weight:700; color:var(--forest); white-space:nowrap;}
  .hint{color:var(--ink-soft); font-size:calc(12px * var(--text-scale)); margin-top:6px;}
  .empty{color:var(--ink-soft); font-style:italic; font-size:calc(14px * var(--text-scale));}
  #fileInputFull{display:none;}

  main a, .cat-desc a{ color:var(--forest); text-decoration:none; border-bottom:1px solid var(--amber); padding-bottom:1px; }
  main a:hover, .cat-desc a:hover{ color:var(--amber-2,var(--amber)); border-bottom-color:var(--forest); }
  a.tag-link{ display:inline-block; ; color:var(--forest); font-weight: 600; border:1px solid var(--amber); border-radius:999px; padding:1px 10px 2px; font-size:1.2em; border-bottom:none; text-decoration:none; }
  a.tag-link:hover{ background:var(--forest); color:var(--paper); border-color:var(--forest); }

  #coverImageWrap{ max-width:1300px; margin:0 auto 18px; padding:0 24px; }
  #coverImageWrap img{ width:100%; display:block; border-radius:var(--radius); border:1px solid var(--line); }

  .cat-desc{ font-size:calc(18px * var(--text-scale)); font-weight: 700; color:var(--ink-soft); border-radius:8px; padding:6px 10px; margin-bottom:8px; white-space:pre-line; }

  .cat-toggle{ background:transparent; border:1px solid var(--line); color:var(--ink-soft); width:26px; height:26px; border-radius:6px; cursor:pointer; font-size:12px; margin-right:8px; transition:transform .15s; flex:none; }
  .cat-toggle:hover{ border-color:var(--forest); color:var(--forest); }
  .card.collapsed .cat-body{ display:none; }
  .collapse-toolbar{ display:flex; justify-content:flex-end; gap:8px; margin:2px 0 10px; }

  .mark-btn{ border:1px solid var(--line); background:#fff; color:var(--ink-soft); width:30px; height:30px; border-radius:6px; cursor:pointer; font-size:calc(13px * var(--text-scale)); line-height:1; display:flex; align-items:center; justify-content:center; padding:0; }
  .mark-btn:hover{ border-color:var(--forest); color:var(--forest); }
  .mark-btn.on{ background:var(--amber-soft); border-color:var(--amber); color:var(--amber); }
  .mark-btn.on[data-mark*="|liked"]{ background:#F6D9D2; border-color:var(--coral); color:var(--coral); }

  .typo-strip{ max-width:1300px; margin:0 auto 24px; padding:0 24px; }
  .typo-row{ display:flex; align-items:center; gap:10px; background:var(--paper-2); border:1px solid var(--line); border-radius:999px; padding:10px 16px; }
  .typo-row .typo-label{ color:var(--ink-soft); font-size:calc(12px * var(--text-scale)); white-space:nowrap; }
  .typo-row a.ghost{ text-decoration:none; }
  .task-num{ color:var(--ink-soft); font-weight:700; }
  #celebrateLayer{position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden;}
  .celebrate-msg{
    position:fixed; top:16%; left:50%; transform:translate(-50%,-40px) scale(.8);
    background:var(--forest); color:var(--paper); font-family:var(--font-display);
    font-weight:700; font-size:calc(18px * var(--text-scale)); padding:14px 26px;
    border-radius:999px; box-shadow:0 8px 24px rgba(0,0,0,.25); text-align:center;
    opacity:0; animation:celebrateMsg 2.6s ease forwards; max-width:80vw;
  }
  @keyframes celebrateMsg{
    0%{opacity:0; transform:translate(-50%,-40px) scale(.8);}
    12%{opacity:1; transform:translate(-50%,0) scale(1);}
    80%{opacity:1;}
    100%{opacity:0; transform:translate(-50%,-10px) scale(.95);}
  }
  .celebrate-particle{
    position:fixed; top:-40px; font-size:calc(22px * var(--text-scale));
    animation-name:celebrateFall; animation-timing-function:ease-in; animation-fill-mode:forwards;
  }
  @keyframes celebrateFall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(100vh) rotate(360deg); opacity:0; }
  }  .faq-link{
    color:var(--forest); font-family:var(--font-display); font-weight:700;
    font-size:calc(15px * var(--text-scale)); text-decoration:none;
    border-bottom:2px solid var(--amber); padding-bottom:1px; margin-right:6px;
  }
  .faq-link:hover{ color:var(--amber); border-bottom-color:var(--forest); }
</style>
</head>

       обычные теги (p, img, table и т.п.), как раньше, без вёрстки.
       Пусто — ничего не отображается. -->
</div>


<div id="coverImageWrap" style="display:none;"><img id="coverImageImg" alt=""></div>

<main>
  <div class="card" id="syncCard">
    <div class="row">
      <div>
        <label class="hint" style="display:block;">Ник (для итоговой отправки)</label>
        <input type="text" id="nickInput" style="width:220px;">
      </div>
    </div>
    <div class="hint" style="margin-top:6px;">«Отправить итоги сезона»</div>
  </div>
  <!-- Блок статистики и кнопки финальной отправки спрятан атрибутом hidden —
       весь JS продолжает работать в фоне как обычно, просто не рисуется на экране.
       Чтобы открыть блок в конце сезона: сотри слово hidden из тега ниже (и только его). -->
  <div class="card" id="statsCard" hidden>
    <h3 style="margin-bottom:10px;">Статистика</h3>
    <div id="statsList" class="hint">—</div>
    <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--line);">

    </div>
  </div>
  <div class="card">
    <h3 style="margin-bottom:10px;">Планы на сезон 10 | 30 | 60 | 90</h3>
    <div class="quotas" id="quotasList"></div>
  </div>
  <div class="collapse-toolbar">
    <button class="ghost" id="collapseAllBtn">▸ свернуть все</button>
    <button class="ghost" id="expandAllBtn">▾ развернуть все</button>
  </div>
  <div id="categoriesView"></div>
</main>

<footer class="progress">
  <span class="progress-num" id="progressLabel">0 / 0</span>
  <div class="bar-wrap"><div class="bar-fill" id="progressBarFill" style="width:0%"></div></div>
  <span class="hint" id="progressPct">0%</span>
</footer>

      "tasks": [
        {
          "id": "tcdbqud0",
          "text": "От лета до зимы. Расскажите, как меняется всё вокруг в течение осени: природа, город, вы сами."

          "id": "t4yvhmk5",
          "text": "Самый главный праздник в России — Новый год, но до него ещё долго. А что вы отмечаете ещё? Какие праздники, даты? Может быть, у вас день рождения осенью или, как у меня, перед самым её началом?"

          "id": "ta43h5yt",
          "text": "Осень — время дождей. Любите дождь? Напишите рассказ, эссе или зарисовку, в которой участвует дождь."

        {
          "id": "tyrnzpsw",
          "text": "Напишите про ваше любимое осеннее место. Куда любите ходить? Почему именно осенью?"

        {
          "id": "tupeuyj7",
          "text": "Осенний день год кормит. Что собираем в лесах, в полях, на даче?"

        {
          "id": "tioprjjx",
          "text": "Птицы улетают. Знаете, что такое мурмурация? Видели когда-нибудь? А может быть, удалось заснять журавлиный клин в вышине? А если вы живёте на юге, то к вам осенью птицы прилетают. Расскажите и покажите."

          "id": "twbvfj6u",
          "text": "Пошуршать листвой. Прогуляйтесь по тротуарам или аллеям парка, покрытым толстым мягким ковром из опавших листьев. Может, даже босиком? Напишите о своих ощущениях!"

          "id": "thlj7krq",
          "text": "Первый снег. Как вы его встречали? Ловили, как в детстве, пушистые хлопья? Бросались снежками? А может, рискнуть и пройтись по белой дорожке в купальнике, чувствуя невесомые прикосновения снежинок!"

    {
      "id": "tm0ocn15",
      "name": "ВОПРОСЫ по ХЕШМОБАМ",
      "desc": "",
      "tasks": [
        {
          "id": "t99oh6fg",
          "text": "**#веловоскресенье:** - Умеете держаться на велосипеде? Помните, как учились? \nЕсть велик? Где вы его храните? Сити-байк или спортивный? \nКогда последний раз катались? Какой самый дальний маршрут случалось проехать? Удобная ли вокруг местность для поездок? \nРазбортовать и заклеить камеру сумеете? Слетевшую цепь поправить? \nКак вам электровеники? Пробовали? Надолго хватает заряда? Велотренажёр vs. реальные покатушки?"
        },
        {
          "id": "tc27jpkt",
          "text": "**#цветыпопонедельникам** - Любимый цветок? Сами разводите? У вас лёгкая рука — всё растёт и цветёт, что ни посади?\nМного цветов вокруг? Газоны ухоженные? Есть интересные цветочные инсталляции? \nВы за кого, если выбирать между: «Цветы для того и выращивают, чтобы делать букеты; продукты мы едим, цветами любуемся, их срок недолог — и это в порядке вещей» и «Цветам место исключительно на клумбе, а не в вазе!»? \nЕсли нужно на скорую руку изобразить цветочек, что это будет — ромашка, тюльпанчик, розочка? Нарисуйте и раскрасьте )"
        },
        {
          "id": "tzb5obb7",
          "text": "**#архитектураповторникам** - Что вам больше по душе — старинные особнячки или современный стиль из стекла и стали? Знаете названия архитектурных стилей? Отличите на местности рококо от сталинского ампира?\nПокажите самое необычное здание в округе. Самое ветхое. Самое симпатичное. Самое высокое. Дом с историей. Есть такое, куда хотелось бы заглянуть: а как там внутри?\nПомните свою школу, вуз, садик — как выглядело здание? Типовой проект или что-то особенное?\nПокажите интересную «малую архитектурную форму», мимо которой часто ходите."
        },
        {
          "id": "tpjioiap",
          "text": "**#природнаясреда** - Далеко или в пешей доступности? Ухоженная, с размеченными дорожками, или первозданный бурелом? Есть у вас любимые местечки на природе, у водоёма? Часто удаётся выбраться?\nНа пляже были этим летом или не очень-то и хотелось?\nЕсть ли любимые природные уголки, о которых вы вспоминаете с грустью — теперь асфальт и бетон на месте полян и родников?\nСамая первая из запомнившихся прогулок на природе? \nЕсли сейчас станете выбирать отдых под открытым небом, где предпочтёте его провести — в лесу, на море, у реки, в горах...?"
        },
        {
          "id": "tv2uo34d",
          "text": "**#жизненнаясреда** - Антропогенное окружение \nКуда бы вы повели подругу показать  любимые места? А сами там часто гуляете?\nОткуда на ваш город или округу можно посмотреть с высоты?\nСамое выигрышное время или сезон для фото вашего города/местности — в ночной подсветке, в утренней дымке, в снегу, на пике цветения?"
        },
        {
          "id": "tvsbpyjb",
          "text": "#**танцыпосредам** - Умеете танцевать? Занимаетесь профессионально?\nЗастали парковые танцплощадки с живой музыкой? Или дискотеки с диджеями?\nДавно ли танцевали на вечеринке или корпоративе?\nТанцы на площади (под старинный патефон) — бывает у вас такое?"
        },
        {
          "id": "tmgue13h",
          "text": "#**птицыпочетвергам** - Сколько птичьих голосов могли бы различить? (Кукушка, воробей, ворона... считаются.)\nСлучалось видеть птичье гнездо живьем, не на фото? Чьё?\nКормите пернатых регулярно, принципиально не кормите или смотря кого и где? С голубями уживаетесь?\nВ опросе «какую птицу выбрать символом города, области, страны» кого бы вы выбрали?\nСамая редкая из птиц, которых вам случалось увидеть или заснять? (В зоопарке тоже годится, если чем-то запомнилась.)"
        },
        {
          "id": "tws8ryyz",
          "text": "#**рыбныйчетверг** - Рыбу ловите? Хоть разок пробовали удить? Что сложнее — поймать или потом возиться с разделкой? А коптить умеете? Есть свой фирменный подход к засолке?\nЛюбите смотреть на аквариум? Есть свой? Пробовали когда-нибудь завести? Долго продержался?\nАкулу живьём видели? А дельфина гладили?\nЗолотая рыбка права или вы бы на её месте отблагодарили старика более действенно? Или не за что его благодарить-то?"
        },
        {
          "id": "tvxjr322",
          "text": "#**четвероногийчетверг** - На ком из четвероногих вы катались верхом? (В два года на домашнем пёсике — тоже считаем.)\nГужевой транспорт случалось видеть не на аттракционе? А кого видели в естественной среде? (Не в вольере.) Кто-то, кроме собак, за вами гнался?\nЗа кем приходилось ухаживать?  Терпеть не могу... - есть такие?\n«Если бы не фермы, ... вообще бы уже не осталось, а посевы ради растительного рациона полностью вытеснили бы остатки дикой природы»: — «да» / «нет» / «не знаю»?"
        },
        {
          "id": "tu97uqay",
          "text": "#**пятничныекотики** - Рыжики или серополосатики? Пушистики или короткошёрстные?Дворовые/уличные есть вокруг? Подкармливают их?\nВидели когда-нибудь кота за работой, соответствующей занимаемой должности?\nХотели бы вы побыть котиком? А если бы стали на сутки (сохраняя память и собственное «я») — куда бы забрались?\nЗнаете, зачем кошки мурчат? Спросите ИИ:)"
        },
        {
          "id": "tz1axg1o",
          "text": "#**ачётаковапопятницам** - Самый первый запомнившийся анекдот? Много их знаете, любите рассказывать? Умеете развеселить компанию, рассмешить детей?\nНосом в торт, поскользнувшись — в лужу: это смешно? Шутка vs подлянка - в чем разница?\nЛюбимая комедия из детства? Покажите рилс/шорт (короткую видюху) — реально ржачный.\nНарисуйте или сгенерируйте смешную картинку про арбуз.\nКакое слово из новояза или иностранного языка кажется смешным/стрёмным? Смешной топоним припомните? Прикольную вывеску?"
        },
        {
          "id": "t7hr4n7h",
          "text": "#**субботниепёсики** - У вас была собака? Есть сейчас? На цепи или вместе с семьёй за столом? Сохранились фото, как он был щеночком? Учили питомца трюкам? Запрягали в саночки? \nКакая порода кажется самой причудливой? Забавляют одежки для собачки? Когда-нибудь посещали собачьего парикмахера?\nМогли бы нарисовать грустную мокрую собаку? Попробуйте!"
        },
        {
          "id": "tx7k8yo6",
          "text": "#**субботнеефотодлядуши** - Сделайте подборку самых душевных кадров минувшего сезона из своего блога или из френдленты."
        },
        {
          "id": "twgeiu5b",
          "text": "#**люкогеография**  - Вам попадались примечательные крышки люков? Какой рисунок на крышке вы бы выбрали для своего города, района, улицы? Попробуйте сгенерировать его по описанию или нарисовать от руки."
        },
        {
          "id": "tusm0v0o",
          "text": "#**уличноеискусство**  - Граффити: Искусство или хулиганство? Оживляет индустриальный пейзаж или пачкает стены? Не было ли желания что-нибудь самостоятельно что-нибудь изобразить на стене? Или был такой опыт? Какому фасаду или забору в округе подошла бы «настенная роспись»? Что бы вы там изобразили? Сгенерируйте, загрузив фото забора в нейросеть."
        },
        {
          "id": "t8dam2pr",
          "text": "#**моиреки / #моря** - Сколько рек и морей довелось повидать? А в скольких — окунуться, ноги замочить? Проплыть на судне? \nСамые выдающиеся из рек — самая крупная из посещённых, самая быстрая, ещё чем-нибудь примечательная: сделайте дайджест по дневниковым записям."
        },
        {
          "id": "t0u5wbcm",
          "text": "#**уличныекофейни** - У вас принято ставить столики на тротуаре? Погода, общая обстановка позволяют?  Любите так посидеть? Покажите самую антуражную из встреченных или посещённых."
        },
        {
          "id": "tfuh44ye",
          "text": "#**фонтанывгороде** - У вас в городе есть фонтаны? Действуют или остаются памятниками бесхозяйственности? Какой самый популярный? Самый озорной, если посмотреть под нужным углом? \nДетвора в них плещется? А вам давно приходила мысль искупаться в фонтане? Боролись с искушением или на лету отогнали?"
        },
        {
          "id": "tjvudw4h",
          "text": "#**часы_на_башне** «Бьют часы на старой башне» или давно уж «показывают правильное время два раза в сутки»? Или никаких часовых башен в округе? В поездках встречались, запомнились, остались фото?"
        },
        {
          "id": "tu4zhwzu",
          "text": "#**лавочки_скамеечки** - Любимая лавочка, лавочка с историей, необычной конструкции — расскажите, покажите."

          "id": "tw2l1lzh",
          "text": "#**позабытпозаброшен**  - Разруха и запустение, abandoned... \n«А когда-то!» Что это было, что там происходило? Жаль былого?"
        },
        {
          "id": "tddeq4e7",
          "text": "#**смотримподноги** - Наблюдаем, подмечаем, считаем — попробуйте так на прогулке и расскажите, что интересного встретилось."

        },

          "id": "t33vkcsg",
          "text": "#**фоторецепт - кулинария** «У каждой хозяйки свой борщ». Не только борщ — даже глазунью и омлет все готовят по-своему.\n Покажите своё — самое расхожее и обиходное блюдо: как **вы** его делаете."

          "text": "#**карандашами_и_красками** - Увлекаетесь или последний раз с удовольствием рисовали в детском саду?«Я умею рисовать...» - что? Принцессу? Парусник? Рыцаря? Автомобиль? Микки-Мауса? Герб Андорры? Схему трансформатора? Можете что-то одно такое, но уверенно?"

const STORAGE_KEY = 'ljMarathonState_v1';

function loadState(){
  let state;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? JSON.parse(raw) : null;
  }catch(e){ state = null; }
  if(!state){
    state = {
      title: EMBEDDED_TEMPLATE.title, coverImage: EMBEDDED_TEMPLATE.coverImage || '',
      quotas: EMBEDDED_TEMPLATE.quotas, categories: EMBEDDED_TEMPLATE.categories,
      templateVersion: TEMPLATE_VERSION,
      progress: { quotaTargets:{}, tasks:{}, collapsed:{} }
    };
  }
  if(!state.progress) state.progress = {quotaTargets:{}, tasks:{}, collapsed:{}};
  if(!state.progress.collapsed) state.progress.collapsed = {};
  if(!state.progress.milestones) state.progress.milestones = {global:0, cats:{}, tasks:{}};
  if(!state.settings) state.settings = {nick:''};
  if(state.templateVersion !== TEMPLATE_VERSION){
    // подтянули новую версию шаблона; личный прогресс (по id заданий) не трогаем
    state.title = EMBEDDED_TEMPLATE.title;
    state.coverImage = EMBEDDED_TEMPLATE.coverImage || '';
    state.quotas = EMBEDDED_TEMPLATE.quotas;
    state.categories = EMBEDDED_TEMPLATE.categories;
    state.templateVersion = TEMPLATE_VERSION;
  }
  return state;
}

let state = loadState();
let sendingFinal = false;

function findTask(id){
  for(const cat of state.categories){
    const task = cat.tasks.find(t=>t.id===id);
    if(task) return {cat, task};
  }
  return null;
}

function isLikelyUrl(s){
  const v = (s||'').trim();
  if(!v || /\s/.test(v)) return false;
  return /^https?:\/\/[^\s]+\.[^\s]+/i.test(v);
}
function isDuplicateLink(taskId, idx, val){
  for(const tid in state.progress.tasks){
    const ts = state.progress.tasks[tid];
    if(!ts || !ts.links) continue;
    for(let i=0;i<ts.links.length;i++){
      if(tid===taskId && i===idx) continue;
      if(ts.links[i].trim() === val) return true;
    }
  }
  return false;
}

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function getTaskState(id){
  if(!state.progress.tasks[id]) state.progress.tasks[id] = {checked:false, links:[''], marks:{liked:false}};
  const t = state.progress.tasks[id];
  if(!t.marks) t.marks = {liked:false};
  return t;
}

function countDoneForQuota(){
  return Object.values(state.progress.tasks).filter(t=>t.checked).length;
}

function renderProgress(){
  const total = state.categories.reduce((s,c)=>s+c.tasks.length,0);
  const done = countDoneForQuota();
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progressLabel').textContent = `${done} / ${total}`;
  document.getElementById('progressBarFill').style.width = pct+'%';
  document.getElementById('progressPct').textContent = pct+'%';
}

/* Локальный подсчёт статистики — без сети, из того же state,
   тем же фильтром isLikelyUrl, что используется для подсветки "плохих" ссылок. */
function renderLocalStats(){
  const statsListEl = document.getElementById('statsList');
  if(!statsListEl) return;
  let totalLinks = 0, challengeLinks = 0, completedChallenges = 0;
  state.categories.forEach(cat=>{
    const isChallenge = (cat.name||'').trim().toLowerCase() === CHALLENGE_CATEGORY_NAME.toLowerCase();
    cat.tasks.forEach(t=>{
      const ts = state.progress.tasks[t.id];
      if(!ts || !ts.links) return;
      const count = ts.links.filter(isLikelyUrl).length;
      totalLinks += count;
      if(isChallenge){
        challengeLinks += count;
        if(count > 0 && count % CHALLENGE_COMPLETE_THRESHOLD === 0) completedChallenges++;
      }
    });
  });
  statsListEl.innerHTML = `
    <div style="display:flex; flex-direction:column; gap:8px;">
      <div>🔗 <b>Всего ссылок в чек-листе:</b> <span class="mono">${totalLinks}</span></div>
      <div>🎯 <b>Из них в «Челленджах»:</b> <span class="mono">${challengeLinks}</span></div>
      <div>🏆 <b>Полностью выполненных челленджей</b> (кратно ${CHALLENGE_COMPLETE_THRESHOLD}): <span class="mono">${completedChallenges}</span></div>
    </div>
  `;
}

function collectFinalRows(){
  const rows = [];
  state.categories.forEach(cat=>{
    cat.tasks.forEach(t=>{
      const ts = state.progress.tasks[t.id];
      if(!ts || !ts.links) return;
      const count = ts.links.filter(isLikelyUrl).length;
      if(count > 0){
        rows.push({
          category: cat.name,
          task: t.text.replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/\*\*/g,''),
          taskId: t.id,
          count
        });
      }
    });
  });
  return rows;
}

async function sendFinalStats(){
  if(sendingFinal) return;
  if(state.progress.finalSent){
    const prev = new Date(state.progress.finalSent.ts).toLocaleString('ru-RU');
    if(!confirm(`Итоги уже отправлялись ${prev} (строк: ${state.progress.finalSent.rows}). Отправить ещё раз?`)) return;
  }
  const rows = collectFinalRows();
  if(!rows.length){
    alert('Пока нет ни одной введённой ссылки — отправлять нечего.');
    return;
  }
  sendingFinal = true;
  const statusEl = document.getElementById('finalSendStatus');
  const btn = document.getElementById('sendFinalBtn');
  btn.disabled = true;
  statusEl.textContent = 'отправляю…';
  const payload = {
    type: 'final',
    token: FINAL_TOKEN,
    nick: state.settings.nick || 'аноним',
    ts: new Date().toISOString(),
    rows
  };
  try{
    const res = await fetch(FINAL_STATS_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(data && data.ok){
      state.progress.finalSent = {ts: payload.ts, rows: rows.length};
      save();
      statusEl.textContent = `✓ отправлено: ${rows.length} строк, ${new Date(payload.ts).toLocaleString('ru-RU')}`;
    } else {
      statusEl.textContent = '✗ сервер отклонил запрос' + (data && data.reason ? ' (' + data.reason + ')' : '');
    }
  }catch(err){
    statusEl.textContent = '✗ не удалось отправить — нет связи или таблица ещё не готова. Можно попробовать ещё раз позже.';
  }finally{
    sendingFinal = false;
    btn.disabled = false;
  }
}

function renderMarathon(){
  
  const active = document.activeElement;
  let restoreSelector = null, selStart = null, selEnd = null;
  const catViewEl = document.getElementById('categoriesView');
  if(active && catViewEl && catViewEl.contains(active) && active.dataset){
    const key = Object.keys(active.dataset)[0];
    if(key){ restoreSelector = `[data-${key}="${CSS.escape(active.dataset[key])}"]`; }
    if(typeof active.selectionStart === 'number'){ selStart = active.selectionStart; selEnd = active.selectionEnd; }
  }
  const scrollY = window.scrollY;

  document.getElementById('marathonTitle').textContent = '🦊 ' + (state.title || 'Марафон ЖЖ');
  document.getElementById('nickInput').value = state.settings.nick || '';
  renderCover();
  renderLocalStats();

  if(!sendingFinal){
    const finalStatusEl = document.getElementById('finalSendStatus');
    if(finalStatusEl){
      finalStatusEl.textContent = state.progress.finalSent
        ? `✓ последняя отправка: ${new Date(state.progress.finalSent.ts).toLocaleString('ru-RU')}, строк: ${state.progress.finalSent.rows}`
        : '';
    }
  }

  const qEl = document.getElementById('quotasList');
  qEl.innerHTML = state.quotas.map(q=>{
    const target = state.progress.quotaTargets[q.id] ?? '';
    return `<div class="quota">
      <div class="label">${escHtml(q.label)}</div>
      <div class="set">
        <input type="number" min="0" placeholder="N" value="${target}" data-quota="${q.id}">
        <span class="hint">${escHtml(q.unit)}</span>
      </div>
    </div>`;
  }).join('') || '<div class="empty">квоты не заданы</div>';

  const cEl = document.getElementById('categoriesView');
  cEl.innerHTML = state.categories.map(cat=>{
    const collapsed = !!state.progress.collapsed[cat.id];
    return `
    <div class="card ${collapsed?'collapsed':''}">
      <div class="cat-header">
        <div class="row" style="gap:6px;">
          <button class="cat-toggle" data-toggle="${cat.id}">${collapsed?'▸':'▾'}</button>
          <h3>${escHtml(cat.name)}</h3>
        </div>
        <span class="hint mono">${cat.tasks.filter(t=>getTaskState(t.id).checked).length} / ${cat.tasks.length}</span>
      </div>
      <div class="cat-body">
        ${cat.desc && cat.desc.trim() ? `<div class="cat-desc">${formatTaskText(cat.desc)}</div>` : ''}
        <div class="task-grid">
          ${cat.tasks.map((t,idx)=>{
  const ts = getTaskState(t.id);
  return `<div class="task-card ${ts.checked?'done':''}">
    <div class="task-card-inner">
      <label>
        <input type="checkbox" ${ts.checked?'checked':''} data-check="${t.id}">
        <span><span class="task-num">${idx+1}.</span> ${formatTaskText(t.text)}</span>
      </label>
                <div class="task-marks">
                  <button type="button" class="mark-btn ${ts.marks.liked?'on':''}" data-mark="${t.id}|liked" title="Понравилось">♥</button>
                </div>
                ${ts.checked ? `<div class="links">
                ${ts.links.map((v,i)=>{
                  const val = v.trim();
                  const bad = val && !isLikelyUrl(val);
                  const dup = val && !bad && isDuplicateLink(t.id, i, val);
                  return `<div class="link-field">
                    <div class="link-row">
                      <span class="link-num">${i+1}.</span>
                      <input type="text" class="${(bad||dup)?'link-bad':''}" placeholder="ссылка на пост" value="${escAttr(v)}" data-link="${t.id}|${i}">
                    </div>
                    ${bad ? '<span class="link-warn">⚠ это не похоже на ссылку</span>' : ''}
                    ${dup ? '<span class="link-warn">⚠ такая ссылка уже есть в чек-листе</span>' : ''}
                  </div>`;
                }).join('')}
                </div>` : ''}
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
  `;
  }).join('') || '<div class="empty">категории не заданы</div>';

  save();
  renderProgress();

  if(restoreSelector){
    const el = document.querySelector(restoreSelector);
    if(el){
      el.focus({preventScroll:true});
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
  window.scrollTo(0, scrollY);
}

function renderCover(){
  const wrap = document.getElementById('coverImageWrap');
  const img = document.getElementById('coverImageImg');
  const url = (state.coverImage || '').trim();
  if(url){
    img.onerror = ()=>{ wrap.style.display = 'none'; };
    img.src = url;
    wrap.style.display = 'block';
  } else {
    wrap.style.display = 'none';
  }
}

document.getElementById('nickInput').addEventListener('input', e=>{ state.settings.nick = e.target.value; save(); });
document.getElementById('sendFinalBtn').addEventListener('click', sendFinalStats);

document.getElementById('quotasList').addEventListener('input', e=>{
  if(e.target.dataset.quota){
    state.progress.quotaTargets[e.target.dataset.quota] = e.target.value;
    save();
  }
});

function celebrate(message, emojis, count){
  let layer = document.getElementById('celebrateLayer');
  if(!layer){
    layer = document.createElement('div');
    layer.id = 'celebrateLayer';
    document.body.appendChild(layer);
  }
  const msg = document.createElement('div');
  msg.className = 'celebrate-msg';
  msg.textContent = message;
  layer.appendChild(msg);
  setTimeout(()=>msg.remove(), 2700);

  for(let i=0;i<count;i++){
    const p = document.createElement('span');
    p.className = 'celebrate-particle';
    p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    p.style.left = Math.random()*100 + 'vw';
    const duration = 1.6 + Math.random()*1.2;
    const delay = Math.random()*0.6;
    p.style.animationDuration = duration+'s';
    p.style.animationDelay = delay+'s';
    layer.appendChild(p);
    setTimeout(()=>p.remove(), (duration+delay+0.3)*1000);
  }
}

function checkTaskLinkMilestone(taskId){
  if(!state.progress.milestones) state.progress.milestones = {global:0, cats:{}, tasks:{}};
  if(!state.progress.milestones.tasks) state.progress.milestones.tasks = {};

  const ts = getTaskState(taskId);
  const validCount = ts.links.filter(isLikelyUrl).length;

  if(validCount > 0 && validCount % CHALLENGE_COMPLETE_THRESHOLD === 0 && validCount > (state.progress.milestones.tasks[taskId]||0)){
    state.progress.milestones.tasks[taskId] = validCount;
    const found = findTask(taskId);
    const label = found ? found.task.text.replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/\*\*/g,'') : 'задание';
    celebrate(`«${label}» — ${validCount} ссылок в одном задании! 🎆`, ['🏆','✨','🎆','🎉'], 28);
  }
  save();
}

function checkGlobalLinkMilestone(){
  if(!state.progress.milestones) state.progress.milestones = {global:0, cats:{}, tasks:{}};

  const totalLinks = Object.values(state.progress.tasks)
    .reduce((sum,t) => sum + (t.links ? t.links.filter(v => isLikelyUrl(v)).length : 0), 0);

  if(totalLinks > 0 && totalLinks % CHALLENGE_COMPLETE_THRESHOLD === 0 && totalLinks > state.progress.milestones.global){
    state.progress.milestones.global = totalLinks;
    celebrate(`Респект! Уже ${totalLinks} 🍬`, ['🍬','🍭','🍫'], 16);
  }
  save();
}

document.getElementById('categoriesView').addEventListener('change', e=>{
  if(e.target.dataset.check){
    const id = e.target.dataset.check;
    const ts = getTaskState(id);
    ts.checked = e.target.checked;
    if(ts.checked && ts.links.length===0) ts.links=[''];
    save(); renderMarathon();
  }
});
document.getElementById('categoriesView').addEventListener('input', e=>{
  if(e.target.dataset.link){
    const [id, idxStr] = e.target.dataset.link.split('|');
    const idx = parseInt(idxStr,10);
    const ts = getTaskState(id);
    ts.links[idx] = e.target.value;
    if(idx === ts.links.length-1 && e.target.value.trim()!==''){
      ts.links.push('');
      save();
      checkGlobalLinkMilestone();
      renderMarathon();
    } else {
      save();
      checkGlobalLinkMilestone();
    }
  }
});
document.getElementById('categoriesView').addEventListener('keydown', e=>{
  if(e.key === 'Enter' && e.target.dataset.link){
    e.preventDefault();
    e.target.blur();
  }
});
document.getElementById('categoriesView').addEventListener('focusout', e=>{
  if(e.target.dataset.link){
    const [id, idxStr] = e.target.dataset.link.split('|');
    const idx = parseInt(idxStr,10);
    const val = e.target.value.trim();
    if(!val) return;
    const bad = !isLikelyUrl(val);
    const dup = !bad && isDuplicateLink(id, idx, val);
    if(bad || dup){
      renderMarathon();
      return; // некорректная или повторная ссылка — в статистику не идёт
    }
    checkTaskLinkMilestone(id);
    checkGlobalLinkMilestone();
    renderMarathon();
  }
});
document.getElementById('categoriesView').addEventListener('click', e=>{
  const toggleBtn = e.target.closest('[data-toggle]');
  if(toggleBtn){
    const id = toggleBtn.dataset.toggle;
    const collapsed = !state.progress.collapsed[id];
    state.progress.collapsed[id] = collapsed;
    save();
    const card = toggleBtn.closest('.card');
    card.classList.toggle('collapsed', collapsed);
    toggleBtn.textContent = collapsed ? '▸' : '▾';
    return;
  }
  const markBtn = e.target.closest('[data-mark]');
  if(markBtn){
    const [id, key] = markBtn.dataset.mark.split('|');
    const ts = getTaskState(id);
    ts.marks[key] = !ts.marks[key];
    save();
    markBtn.classList.toggle('on', ts.marks[key]);
  }
});

  document.querySelectorAll('#categoriesView .cat-toggle').forEach(b=>b.textContent='▸');

  document.querySelectorAll('#categoriesView .card').forEach(card=>card.classList.remove('collapsed'));
  document.querySelectorAll('#categoriesView .cat-toggle').forEach(b=>b.textContent='▾');
});

function download(filename, obj){
  const blob = new Blob([JSON.stringify(obj,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

});
document.getElementById('fileInputFull').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      state = JSON.parse(r.result);
      if(!state.progress) state.progress={quotaTargets:{}, tasks:{}, collapsed:{}};
      if(!state.progress.collapsed) state.progress.collapsed = {};
      if(!state.progress.milestones) state.progress.milestones = {global:0, cats:{}, tasks:{}};
      if(!state.settings) state.settings={nick:''};
      save(); renderMarathon();
    }catch(err){ alert('Не удалось прочитать сохраненный файл'); }
  };
  r.readAsText(f);
});

function escHtml(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function formatTaskText(s){
  let out = escHtml(s);
  out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, text, url)=>{
    const cls = text.trim().startsWith('#') ? ' class="tag-link"' : '';
    return `<a href="${url}" target="_blank" rel="noopener noreferrer"${cls}>${text}</a>`;
  });
  out = out.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  return out;
}
function escAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

renderMarathon();
</script>
